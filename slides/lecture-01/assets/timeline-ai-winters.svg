<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
<defs>
<pattern id="winter" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="8" stroke="#aaaaaa" stroke-width="3"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/></marker>
</defs>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<text x="16" y="24" font-size="18" font-weight="bold" fill="#111111">1956 → 2025: две зимы ИИ и деньги, которые их вызвали</text>
<text x="16" y="42" font-size="11" fill="#666666">Кривая — порядок величины финансирования и рынка ИИ (качественно, не в масштабе). Все цифры — из статьи 1001536.</text>
<rect x="226" y="52" width="66" height="210" fill="url(#winter)" stroke="#999999" stroke-width="1"/>
<text x="229" y="68" font-size="11" font-weight="bold" fill="#333333">ЗИМА 1</text>
<text x="229" y="82" font-size="10" fill="#333333">1974–1980</text>
<rect x="352" y="52" width="118" height="210" fill="url(#winter)" stroke="#999999" stroke-width="1"/>
<text x="356" y="68" font-size="11" font-weight="bold" fill="#333333">ЗИМА 2</text>
<text x="356" y="82" font-size="10" fill="#333333">1987–1993</text>
<rect x="470" y="52" width="190" height="210" fill="#fafafa" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 3"/>
<text x="478" y="68" font-size="10" fill="#777777">1995–2010: «AI» — грязное слово,</text>
<text x="478" y="82" font-size="10" fill="#777777">0 премий Тьюринга за ИИ</text>
<polyline fill="none" stroke="#111111" stroke-width="3" points="118,212 176,158 214,170 226,192 292,244 330,122 352,118 470,236 600,240 660,222 680,200 760,156 850,118 950,88"/>
<line x1="100" y1="262" x2="984" y2="262" stroke="#111111" stroke-width="2" marker-end="url(#arr)"/>
<line x1="118" y1="258" x2="118" y2="266" stroke="#111111" stroke-width="2"/>
<text x="118" y="280" font-size="11" fill="#111111" text-anchor="middle">1956</text>
<line x1="214" y1="258" x2="214" y2="266" stroke="#111111" stroke-width="2"/>
<text x="214" y="280" font-size="11" fill="#111111" text-anchor="middle">1973</text>
<line x1="292" y1="258" x2="292" y2="266" stroke="#111111" stroke-width="2"/>
<text x="292" y="280" font-size="11" fill="#111111" text-anchor="middle">1980</text>
<line x1="330" y1="258" x2="330" y2="266" stroke="#111111" stroke-width="2"/>
<text x="330" y="280" font-size="11" fill="#111111" text-anchor="middle">1985</text>
<line x1="470" y1="258" x2="470" y2="266" stroke="#111111" stroke-width="2"/>
<text x="470" y="280" font-size="11" fill="#111111" text-anchor="middle">1993</text>
<line x1="680" y1="258" x2="680" y2="266" stroke="#111111" stroke-width="2"/>
<text x="680" y="280" font-size="11" fill="#111111" text-anchor="middle">2012</text>
<line x1="760" y1="258" x2="760" y2="266" stroke="#111111" stroke-width="2"/>
<text x="760" y="280" font-size="11" fill="#111111" text-anchor="middle">2017</text>
<line x1="850" y1="258" x2="850" y2="266" stroke="#111111" stroke-width="2"/>
<text x="850" y="280" font-size="11" fill="#111111" text-anchor="middle">2022</text>
<line x1="950" y1="258" x2="950" y2="266" stroke="#111111" stroke-width="2"/>
<text x="950" y="280" font-size="11" fill="#111111" text-anchor="middle">2025</text>
<circle cx="118" cy="212" r="4.5" fill="#111111"/>
<polyline fill="none" stroke="#555555" stroke-width="1.2" points="118,212 118,276 88,276 88,290"/>
<rect x="8" y="290" width="160" height="78" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="18" y="310" font-size="12" font-weight="bold" fill="#111111">1956 · Дартмут</text>
<text x="18" y="327" font-size="11" fill="#333333">Logic Theorist:</text>
<text x="18" y="344" font-size="11" fill="#333333">38 теорем из 52</text>
<circle cx="214" cy="170" r="4.5" fill="#111111"/>
<polyline fill="none" stroke="#555555" stroke-width="1.2" points="214,170 214,276 280,276 280,290"/>
<rect x="200" y="290" width="160" height="78" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="210" y="310" font-size="12" font-weight="bold" fill="#111111">1973 · отчёт Лайтхилла</text>
<text x="210" y="327" font-size="11" fill="#333333">DARPA −90 %:</text>
<text x="210" y="344" font-size="11" fill="#333333">$100 млн → $10 млн</text>
<circle cx="400" cy="166" r="4.5" fill="#111111"/>
<polyline fill="none" stroke="#555555" stroke-width="1.2" points="400,166 400,276 472,276 472,290"/>
<rect x="392" y="290" width="160" height="78" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="402" y="310" font-size="12" font-weight="bold" fill="#111111">1987–1993 · зима 2</text>
<text x="402" y="327" font-size="11" fill="#333333">Lisp-машины −95 %,</text>
<text x="402" y="344" font-size="11" fill="#333333">Symbolics — банкрот,</text>
<text x="402" y="361" font-size="11" fill="#333333">рынок $300–500 млн</text>
<circle cx="680" cy="200" r="4.5" fill="#111111"/>
<polyline fill="none" stroke="#555555" stroke-width="1.2" points="680,200 680,276 664,276 664,290"/>
<rect x="584" y="290" width="160" height="78" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="594" y="310" font-size="12" font-weight="bold" fill="#111111">2012 · AlexNet</text>
<text x="594" y="327" font-size="11" fill="#333333">ошибка top-5</text>
<text x="594" y="344" font-size="11" fill="#333333">26.2 % → 15.3 %</text>
<circle cx="850" cy="118" r="4.5" fill="#111111"/>
<polyline fill="none" stroke="#555555" stroke-width="1.2" points="850,118 850,276 856,276 856,290"/>
<rect x="776" y="290" width="160" height="78" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="786" y="310" font-size="12" font-weight="bold" fill="#111111">2022 · ChatGPT</text>
<text x="786" y="327" font-size="11" fill="#333333">100 млн пользователей</text>
<text x="786" y="344" font-size="11" fill="#333333">за 2 месяца</text>
<circle cx="176" cy="158" r="4.5" fill="#111111"/>
<polyline fill="none" stroke="#555555" stroke-width="1.2" points="176,158 176,286 184,286 184,376"/>
<rect x="96" y="376" width="176" height="78" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
<text x="106" y="396" font-size="12" font-weight="bold" fill="#111111">1969 · DARPA вложило</text>
<text x="106" y="413" font-size="11" fill="#333333">$100 млн в ИИ</text>
<text x="106" y="430" font-size="11" fill="#333333">рынок $10–50 млн/год</text>
<circle cx="330" cy="122" r="4.5" fill="#111111"/>
<polyline fill="none" stroke="#555555" stroke-width="1.2" points="330,122 330,286 376,286 376,376"/>
<rect x="288" y="376" width="176" height="78" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
<text x="298" y="396" font-size="12" font-weight="bold" fill="#111111">1985 · пик $1–2 млрд</text>
<text x="298" y="413" font-size="11" fill="#333333">MYCIN, XCON (ROI 10x)</text>
<text x="298" y="430" font-size="11" fill="#333333">«Пятое поколение» $850 млн</text>
<circle cx="760" cy="156" r="4.5" fill="#111111"/>
<polyline fill="none" stroke="#555555" stroke-width="1.2" points="760,156 760,286 760,286 760,376"/>
<rect x="616" y="376" width="176" height="78" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
<text x="626" y="396" font-size="12" font-weight="bold" fill="#111111">2017 · трансформер</text>
<text x="626" y="413" font-size="11" fill="#333333">«Attention Is All You Need»</text>
<text x="626" y="430" font-size="11" fill="#333333">параллелизм вместо RNN</text>
<circle cx="950" cy="88" r="4.5" fill="#111111"/>
<polyline fill="none" stroke="#555555" stroke-width="1.2" points="950,88 950,286 968,286 968,376"/>
<rect x="806" y="376" width="176" height="78" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
<text x="816" y="396" font-size="12" font-weight="bold" fill="#111111">2025 · ~$250 млрд за год</text>
<text x="816" y="413" font-size="11" fill="#333333">≈ половина всех венчурных</text>
<text x="816" y="430" font-size="11" fill="#333333">инвестиций мира</text>
<rect x="16" y="466" width="968" height="82" fill="#111111"/>
<text x="28" y="490" font-size="13" font-weight="bold" fill="#ffffff">Повторяющийся паттерн, одинаковый в обеих зимах:</text>
<text x="28" y="512" font-size="12.5" fill="#ffffff">демонстрация в узком домене → экстраполяция на «общий интеллект» → деньги → столкновение с ограничениями → обвал финансирования.</text>
<text x="28" y="536" font-size="12" fill="#cccccc">Зимы били не по технологиям, а по обещаниям: работающие решения в своём домене продолжали работать.</text>
</svg>