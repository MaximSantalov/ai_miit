<text x="418" y="318" font-size="12" fill="#111111" text-anchor="middle">z1</text>
<rect x="472" y="300" width="92" height="26" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="518" y="318" font-size="12" fill="#111111" text-anchor="middle">z2</text>
