<text x="372" y="348" font-size="12" fill="#111111">Жирным показаны связи одного токена «Инской» — так делает каждый из N токенов.</text>
<line x1="418" y1="326" x2="418" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#a3)"/>
<line x1="518" y1="326" x2="518" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#a3)"/>
<line x1="618" y1="326" x2="618" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#a3)"/>
<line x1="718" y1="326" x2="718" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#a3)"/>
<line x1="818" y1="326" x2="818" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#a3)"/>
<line x1="918" y1="326" x2="918" y2="360" stroke="#111111" stroke-width="1.5" marker-end="url(#a3)"/>
<rect x="372" y="360" width="592" height="34" fill="#111111"/>
<text x="668" y="383" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Выход: следующий токен</text>
<rect x="372" y="410" width="290" height="94" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
<text x="384" y="432" font-size="14" font-weight="bold" fill="#111111">Что получили</text>
<text x="384" y="452" font-size="12" fill="#111111">• все слова считаются параллельно</text>
<text x="384" y="470" font-size="12" fill="#111111">• прямая связь первого слова с последним</text>
<text x="384" y="488" font-size="12" fill="#111111">• предсказуемое масштабирование</text>
<rect x="674" y="410" width="294" height="94" fill="#111111"/>
<text x="686" y="432" font-size="14" font-weight="bold" fill="#ffffff">Чем платим</text>
<text x="686" y="454" font-size="13" fill="#ffffff">матрица внимания N × N →</text>
<text x="686" y="476" font-size="18" font-weight="bold" fill="#ffffff">O(N²) по памяти и времени</text>
<text x="686" y="495" font-size="11" fill="#dddddd">1 млн токенов — терабайты при наивной реализации</text>
</svg>