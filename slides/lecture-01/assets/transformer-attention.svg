<rect x="772" y="300" width="92" height="26" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="818" y="318" font-size="12" fill="#111111" text-anchor="middle">z5</text>
<rect x="872" y="300" width="92" height="26" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
