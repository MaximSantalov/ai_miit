<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>

  <text x="16" y="26" font-size="19" font-weight="bold" fill="#111111">Две формы задач — и четыре набора инструментов под них</text>
  <text x="16" y="46" font-size="13" fill="#444444">Задачи бизнеса не менялись 70 лет. Менялись только инструменты.</text>

  <!-- column headers -->
  <rect x="286" y="58" width="352" height="52" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
  <text x="298" y="79" font-size="13" font-weight="bold" fill="#111111">ФОРМА 1 — понять, что происходит сейчас</text>
  <text x="298" y="99" font-size="12" fill="#333333">собрать данные в картину и дать ответ</text>

  <rect x="646" y="58" width="338" height="52" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
  <text x="658" y="79" font-size="14" font-weight="bold" fill="#111111">ФОРМА 2 — предсказать будущее</text>
  <text x="658" y="99" font-size="12" fill="#333333">спрос, срок доставки, отказ оборудования</text>

  <rect x="16" y="58" width="262" height="52" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="28" y="79" font-size="14" font-weight="bold" fill="#111111">ЭПОХА ИНСТРУМЕНТОВ</text>
  <text x="28" y="99" font-size="12" fill="#333333">сверху вниз — по времени</text>

  <!-- ROW 1 -->
  <rect x="16" y="116" width="262" height="98" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="28" y="150" font-size="15" font-weight="bold" fill="#111111">Символьный ИИ</text>
  <text x="28" y="171" font-size="13" fill="#333333">1956 — 1974</text>
  <text x="28" y="192" font-size="12" fill="#555555">правила без статистики</text>

  <rect x="286" y="116" width="352" height="98" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <g>
    <rect x="298" y="132" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="320" y="132" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="342" y="132" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="364" y="132" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="386" y="132" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <text x="414" y="144" font-size="12" font-weight="bold" fill="#111111">1 / 5</text>
  </g>
  <text x="298" y="170" font-size="13" fill="#111111">Работает только на игрушечных доменах:</text>
  <text x="298" y="189" font-size="13" fill="#111111">теоремы, кубики, обезьяна и бананы.</text>
  <text x="298" y="206" font-size="12" fill="#555555">Реальный мир требует миллионов правил.</text>

  <rect x="646" y="116" width="338" height="98" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <g>
    <rect x="658" y="132" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="680" y="132" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="702" y="132" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="724" y="132" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="746" y="132" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <text x="774" y="144" font-size="12" font-weight="bold" fill="#111111">0 / 5</text>
  </g>
  <text x="658" y="170" font-size="13" fill="#111111">Не решается вовсе.</text>
  <text x="658" y="189" font-size="13" fill="#111111">Правило описывает то, что уже известно,</text>
  <text x="658" y="206" font-size="13" fill="#111111">и не умеет экстраполировать.</text>

  <!-- ROW 2 -->
  <rect x="16" y="218" width="262" height="98" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="28" y="252" font-size="15" font-weight="bold" fill="#111111">Экспертные системы</text>
  <text x="28" y="273" font-size="13" fill="#333333">1980 — 1987</text>
  <text x="28" y="294" font-size="12" fill="#555555">правила + узкий домен</text>

  <rect x="286" y="218" width="352" height="98" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <g>
    <rect x="298" y="234" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="320" y="234" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="342" y="234" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="364" y="234" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="386" y="234" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <text x="414" y="246" font-size="12" font-weight="bold" fill="#111111">3 / 5</text>
  </g>
  <text x="298" y="272" font-size="13" fill="#111111">Первый бизнес-эффект: симптомы → диагноз</text>
  <text x="298" y="291" font-size="13" fill="#111111">(MYCIN), заказ → конфигурация (XCON).</text>
  <text x="298" y="308" font-size="12" fill="#555555">Но правила пишутся руками и не масштабируются.</text>

  <rect x="646" y="218" width="338" height="98" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <g>
    <rect x="658" y="234" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="680" y="234" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="702" y="234" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="724" y="234" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="746" y="234" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <text x="774" y="246" font-size="12" font-weight="bold" fill="#111111">1 / 5</text>
  </g>
  <text x="658" y="272" font-size="13" fill="#111111">Почти не сдвинулась.</text>
  <text x="658" y="291" font-size="13" fill="#111111">Нестандартный случай ломает базу правил —</text>
  <text x="658" y="308" font-size="13" fill="#111111">именно на этом системы и рассыпались.</text>

  <!-- ROW 3 -->
  <rect x="16" y="320" width="262" height="98" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <text x="28" y="354" font-size="15" font-weight="bold" fill="#111111">Машинное обучение</text>
  <text x="28" y="375" font-size="13" fill="#333333">2012 — …</text>
  <text x="28" y="396" font-size="12" fill="#555555">статистика вместо правил</text>

  <rect x="286" y="320" width="352" height="98" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <g>
    <rect x="298" y="336" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="320" y="336" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="342" y="336" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="364" y="336" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="386" y="336" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <text x="414" y="348" font-size="12" font-weight="bold" fill="#111111">4 / 5</text>
  </g>
  <text x="298" y="374" font-size="13" fill="#111111">Прорыв: картинка → текст, речь → текст.</text>
  <text x="298" y="393" font-size="13" fill="#111111">Признаки перестали писать руками —</text>
  <text x="298" y="410" font-size="13" fill="#111111">их находит статистика по данным.</text>

  <rect x="646" y="320" width="338" height="98" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <g>
    <rect x="658" y="336" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="680" y="336" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="702" y="336" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="724" y="336" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="746" y="336" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <text x="774" y="348" font-size="12" font-weight="bold" fill="#111111">4 / 5</text>
  </g>
  <text x="658" y="374" font-size="13" fill="#111111">Наконец рабочий инструмент:</text>
  <text x="658" y="393" font-size="13" fill="#111111">спрос, срок доставки, отказ оборудования.</text>
  <text x="658" y="410" font-size="12" fill="#555555">Цена — разметка, обучение, дрейф данных.</text>

  <!-- ROW 4 -->
  <rect x="16" y="422" width="262" height="98" fill="#f2f2f2" stroke="#111111" stroke-width="2.5"/>
  <text x="28" y="456" font-size="15" font-weight="bold" fill="#111111">Большие языковые</text>
  <text x="28" y="474" font-size="15" font-weight="bold" fill="#111111">модели</text>
  <text x="28" y="495" font-size="13" fill="#333333">2017 / 2022 — …</text>

  <rect x="286" y="422" width="352" height="98" fill="#f2f2f2" stroke="#111111" stroke-width="2.5"/>
  <g>
    <rect x="298" y="438" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="320" y="438" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="342" y="438" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="364" y="438" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="386" y="438" width="18" height="14" fill="#111111" stroke="#111111"/>
    <text x="414" y="450" font-size="12" font-weight="bold" fill="#111111">5 / 5</text>
  </g>
  <text x="298" y="476" font-size="13" fill="#111111">Понимает и связывает данные:</text>
  <text x="298" y="495" font-size="13" fill="#111111">текст ↔ код ↔ таблица ↔ речь ↔ картинка.</text>
  <text x="298" y="512" font-size="12" fill="#555555">Понимает данные почти во всех форматах.</text>

  <rect x="646" y="422" width="338" height="98" fill="#f2f2f2" stroke="#111111" stroke-width="2.5"/>
  <g>
    <rect x="658" y="438" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="680" y="438" width="18" height="14" fill="#111111" stroke="#111111"/>
    <rect x="702" y="438" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="724" y="438" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <rect x="746" y="438" width="18" height="14" fill="#ffffff" stroke="#111111"/>
    <text x="774" y="450" font-size="12" font-weight="bold" fill="#111111">2 / 5</text>
  </g>
  <text x="658" y="476" font-size="13" fill="#111111">Шаг назад: не лучше, а часто хуже</text>
  <text x="658" y="495" font-size="13" fill="#111111">специализированной модели.</text>
  <text x="658" y="512" font-size="12" fill="#555555">Предсказывает токен, а не спрос.</text>

  <!-- bottom conclusion -->
  <rect x="16" y="528" width="968" height="26" fill="#111111"/>
  <text x="28" y="546" font-size="13" font-weight="bold" fill="#ffffff">Вывод курса: форму 1 отдаём LLM (интерфейс и оркестрация), форму 2 оставляем ML-модели и солверу — но уже как инструментам агента.</text>
</svg>
